name: Build Yalla Habibi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Inspect Android project ZIP
        run: |
          echo "Repository files:"
          ls -la

          echo "Checking ZIP archive:"
          unzip -l Yalla_Habibi_Android_Project.zip

          mkdir -p extracted_project
          unzip -q Yalla_Habibi_Android_Project.zip -d extracted_project

          echo "Extracted project files:"
          find extracted_project -maxdepth 5 -type f | head -200

          echo "Searching for Gradle wrapper:"
          find extracted_project -type f -name gradlew

          echo "Searching for Android Gradle build files:"
          find extracted_project -type f \
            \( -name build.gradle -o -name build.gradle.kts \
            -o -name settings.gradle -o -name settings.gradle.kts \)
