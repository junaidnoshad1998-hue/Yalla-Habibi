name: Build Yalla Habibi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

            - name: Check project files
        run: |
          echo "Files in repository root:"
          ls -la
          echo "Searching for Gradle wrapper:"
          find . -name gradlew -type f
          echo "Searching for Gradle build files:"
          find . -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -type f

            - name: Check project files
        run: |
          echo "Files in repository root:"
          ls -la
          echo "Searching for Gradle wrapper:"
          find . -name gradlew -type f
          echo "Searching for Gradle build files:"
          find . -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -type f

           - name: Build APK
        run: |
          echo "Checking project files..."
          ls -la
          echo "Searching for Gradle wrapper..."
          find . -name gradlew -type f
          echo "Searching for Gradle build files..."
          find . -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -type f

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found in the repository root."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-habibi-apk
          path: app/build/outputs/apk/debug/*.apk
